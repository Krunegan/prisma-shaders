[anchors]
# The lines the patch_*.glsl files of the repository's packs anchor to
files = [
  "nodes_shader/opengl_vertex.glsl",
  "nodes_shader/opengl_vertex.glsl",
]
lines = [
  "worldPosition = (mWorld * pos).xyz;",
  "gl_Position = mWorldViewProj * pos;",
]

